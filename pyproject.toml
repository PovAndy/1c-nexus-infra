[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "1c-nexus-infra"
version = "1.0.1"
description = "Portable 1C workspace infrastructure: Graph V2, RAG lifecycle, prompt-contract validation, BSL evaluation, and MCP bridge helpers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PovAndy", email = "PovAndy@users.noreply.github.com" }]
keywords = ["1c", "1c-infrastructure", "rag", "workspace-graph", "bsl", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "tree-sitter",
  "tree-sitter-languages",
  "networkx",
  "watchdog",
  "pytest",
  "mcp",
  "httpx",
  "lxml",
]

[project.scripts]
1c-graph = "scripts.workspace_graph_v2_manager:main"
1c-rag = "scripts.kb_manager:main"
1c-eval = "scripts.eval_bsl_candidate:main"
1c-prompt-check = "scripts.validate_prompt_contracts:main"

[project.optional-dependencies]
dev = [
  "ruff",
  "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts", "data"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
